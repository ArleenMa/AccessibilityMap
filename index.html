<!DOCTYPE html>
<html>
<head>
    <title>Accessibility Map</title>
    <!-- Link Leaflet's Style Sheet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Give the map a size, otherwise it stays invisible */
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>

    <!-- This blank box is where your map will actually sit -->
    <div id="map"></div>

    <!-- Link Leaflet's JavaScript Brains -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
const map = L.map('map').setView([35.91, -79.05], 50);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const marker = L.marker([35.91, -79.05]).addTo(map);
marker.bindPopup("<b>Hello!</b><br>I am a clickable popup.").openPopup();

</script>
</body>
</html>
